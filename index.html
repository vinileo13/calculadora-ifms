<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 style="font-size: 50px;">Calculadora IFMS</h1>
    <p>Bem-vindo à calculadora!</p>

    <div class="quadrado"></div>
    <div class="painel" style="font-size: 40px;">0</div>

<div class="sete" style="font-size: 30px;">7</div>
<div class="oito" style="font-size: 30px;">8</div>
<div class="nove" style="font-size: 30px;">9</div>
<div class="mais" style="font-size: 30px;">+</div>
<div class="quatro" style="font-size: 30px;">4</div>
<div class="cinco" style="font-size: 30px;">5</div>
<div class="seis" style="font-size: 30px;">6</div>
<div class="menos" style="font-size: 30px;">-</div>
<div class="um" style="font-size: 30px;">1</div>
<div class="dois" style="font-size: 30px;">2</div>
<div class="tres" style="font-size: 30px;">3</div>
<div class="vezes" style="font-size: 30px;">*</div>
<div class="zero" style="font-size: 30px;">0</div>
<div class="ponto" style="font-size: 30px;">.</div>
<div class="igual" style="font-size: 30px;">=</div>
<div class="divisao" style="font-size: 30px;">/</div>
<div class="limpar" style="font-size: 30px;">C</div>

<script src="script.js"></script>
</body>
</html>
